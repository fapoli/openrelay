app = "openrelay"
primary_region = "ams"

[build]

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true

[[services]]
  protocol = "udp"
  internal_port = 7777

  [[services.ports]]
    port = 7777

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
